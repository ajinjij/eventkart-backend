<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — eventkart</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header><div class="header-inner" id="site-nav"></div></header>

<div class="wrap page">
  <h1>Admin dashboard</h1>

  <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:32px" id="stats-grid"></div>

  <p class="section-label">Pending vendor approvals</p>
  <div id="pending-vendors"></div>

  <p class="section-label" style="margin-top:32px">Disputed bookings</p>
  <div id="disputed-bookings"></div>
</div>

<footer>eventkart · connecting customers with trusted event coordinators</footer>

<script src="assets/api.js"></script>
<script>
  requireRole("ADMIN");
  renderNav("admin");

  async function loadStats() {
    const stats = await apiFetch("/admin/stats");
    document.getElementById("stats-grid").innerHTML = `
      <div class="card"><div class="card-body">
        <div class="cat">Commission earned</div>
        <h4 style="font-size:20px">${formatMoney(stats.totalCommission)}</h4>
      </div></div>
      <div class="card"><div class="card-body">
        <div class="cat">Active bookings</div>
        <h4 style="font-size:20px">${stats.activeBookings}</h4>
      </div></div>
      <div class="card"><div class="card-body">
        <div class="cat">Open disputes</div>
        <h4 style="font-size:20px;color:var(--red)">${stats.openDisputes}</h4>
      </div></div>
    `;
  }

  async function loadPendingVendors() {
    const vendors = await apiFetch("/admin/vendors/pending");
    const el = document.getElementById("pending-vendors");
    if (!vendors.length) {
      el.innerHTML = `<div class="empty-state">No pending vendor approvals right now.</div>`;
      return;
    }
    el.innerHTML = vendors.map(v => `
      <div class="list-item">
        <div class="info">
          <h4>${v.businessName}</h4>
          <p>${v.user.name} · ${v.user.email} · ${v.category} · ${v.city}</p>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm btn-fill" onclick="approveVendor(${v.id})">Approve</button>
          <button class="btn btn-sm btn-outline-danger" onclick="rejectVendor(${v.id})">Reject</button>
        </div>
      </div>
    `).join("");
  }

  async function approveVendor(id) {
    try {
      await apiFetch(`/admin/vendors/${id}/approve`, { method: "POST" });
      loadPendingVendors();
    } catch (err) { alert(err.message); }
  }

  async function rejectVendor(id) {
    if (!confirm("Reject this vendor? They won't be able to list packages.")) return;
    try {
      await apiFetch(`/admin/vendors/${id}/reject`, { method: "POST" });
      loadPendingVendors();
    } catch (err) { alert(err.message); }
  }

  async function loadDisputes() {
    const bookings = await apiFetch("/admin/bookings/disputed");
    const el = document.getElementById("disputed-bookings");
    if (!bookings.length) {
      el.innerHTML = `<div class="empty-state">No open disputes.</div>`;
      return;
    }
    el.innerHTML = bookings.map(b => `
      <div class="list-item">
        <div class="info">
          <h4>Booking #${b.id} · ${b.vendor.businessName}</h4>
          <p>${b.customer.name} (${b.customer.email}) · ${formatMoney(b.totalAmount)}</p>
          <p style="color:var(--red)">"${b.disputeReason || "No reason given"}"</p>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm btn-fill" onclick="resolveDispute(${b.id}, 'release')">Release funds to vendor</button>
          <button class="btn btn-sm btn-outline-danger" onclick="resolveDispute(${b.id}, 'refund')">Refund customer</button>
        </div>
      </div>
    `).join("");
  }

  async function resolveDispute(bookingId, action) {
    try {
      await apiFetch(`/payments/${bookingId}/${action}`, { method: "POST" });
      alert(`${action === "release" ? "Funds released to vendor" : "Customer refunded"}.`);
      loadDisputes();
      loadStats();
    } catch (err) { alert(err.message); }
  }

  loadStats();
  loadPendingVendors();
  loadDisputes();
</script>
</body>
</html>
